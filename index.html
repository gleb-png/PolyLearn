<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
<title>PolyLearn</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#f8fafc;background:linear-gradient(135deg,#0f172a,#172554,#111827);min-height:100vh}
button,select{font:inherit}button{border:0;border-radius:12px;padding:11px 16px;background:#2563eb;color:white;cursor:pointer;font-weight:700}button:hover{filter:brightness(1.1)}button:disabled{opacity:.4;cursor:not-allowed}
.app{max-width:1100px;margin:auto;padding:24px}.header{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}.logo{font-size:30px;font-weight:900}.sub{color:#94a3b8}
.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#ffffff12;border:1px solid #ffffff18;padding:10px 14px;border-radius:12px}
.panel{background:#ffffff0d;border:1px solid #ffffff18;border-radius:22px;padding:22px;margin-bottom:18px;backdrop-filter:blur(12px)}
.controls{display:flex;gap:10px;flex-wrap:wrap}.controls select{background:#0f172a;color:white;border:1px solid #ffffff25;border-radius:12px;padding:11px}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px;margin-top:15px}.level{background:#334155}.level.active{background:#7c3aed}.level.done{background:#16a34a}.level.locked{background:#334155}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:18px}.actions button{background:#1e293b;border:1px solid #ffffff18}.actions button.primary{background:#2563eb}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.card{width:min(650px,100%);max-height:90vh;overflow:auto;background:#111827;border:1px solid #ffffff20;border-radius:22px;padding:24px}.close{float:right;border-radius:50%;padding:7px 11px;background:#ef4444}.progress{height:9px;background:#334155;border-radius:10px;overflow:hidden;margin:15px 0}.bar{height:100%;background:#3b82f6;width:0}.word{font-size:34px;font-weight:900;margin:25px 0 8px}.translation{font-size:22px;color:#93c5fd}.question{font-size:24px;font-weight:800;margin:22px 0}.answers{display:grid;gap:10px}.answer{background:#1e293b;text-align:left}.answer.correct{background:#16a34a}.answer.wrong{background:#dc2626}
.setting{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:14px 0;border-bottom:1px solid #ffffff12}.setting:last-child{border-bottom:0}.danger{background:#dc2626}.light{background:linear-gradient(135deg,#e2e8f0,#dbeafe);color:#0f172a}.light .panel,.light .stat{background:#ffffffb8;border-color:#00000012}.light .sub{color:#475569}.light .controls select{background:white;color:#0f172a}.light .actions button{background:white;color:#0f172a}.light .card{background:#f8fafc;color:#0f172a}.light .answer{background:#e2e8f0;color:#0f172a}
@media(max-width:600px){.header{align-items:flex-start;flex-direction:column}.word{font-size:28px}}
</style>

<style id="password-gate-style">
#passwordGate{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#020617,#172554,#111827)}
#passwordGate .gate-card{width:min(420px,100%);background:#111827ee;border:1px solid #ffffff20;border-radius:24px;padding:28px;box-shadow:0 20px 60px #0008;text-align:center;color:#f8fafc}
#passwordGate h1{margin:0 0 8px;font-size:28px}.gate-sub{color:#94a3b8;margin-bottom:22px}
#sitePassword{width:100%;padding:13px 15px;border-radius:12px;border:1px solid #ffffff25;background:#0f172a;color:white;outline:none}
#passwordGate button{width:100%;margin-top:12px}.gate-error{min-height:22px;margin-top:10px;color:#f87171;font-size:14px}
</style>

</head>
<body>

<div id="passwordGate">
  <div class="gate-card">
    <div style="font-size:48px">🔒</div>
    <h1>PolyLearn</h1>
    <div class="gate-sub">Введите пароль для входа</div>
    <input id="sitePassword" type="password" placeholder="Пароль" autocomplete="current-password">
    <button id="passwordEnter">🔓 Войти</button>
    <div id="passwordError" class="gate-error"></div>
  </div>
</div>

<div class="app">
  <div class="header">
    <div><div class="logo">🌍 PolyLearn</div><div class="sub">Изучай языки шаг за шагом</div></div>
    <div class="stats"><div class="stat">⭐ XP: <b id="xp">0</b></div><div class="stat">🪙 <b id="coins">0</b></div></div>
  </div>

  <div class="panel">
    <h2>📚 Обучение</h2>
    <div class="controls">
      <select id="language">
        <option value="en">🇬🇧 English</option><option value="de">🇩🇪 Deutsch</option>
        <option value="es">🇪🇸 Español</option><option value="fr">🇫🇷 Français</option>
      </select>
      <select id="level"></select>
      <button id="start">▶ Начать обучение</button>
    </div>
    <div id="levels" class="levels"></div>
  </div>

  <div class="panel">
    <div class="actions">
      <button id="profile">👤 Профиль</button><button id="study">📚 Учиться</button>
      <button id="test">🧠 Тест</button><button id="words">📖 Мои слова</button>
      <button id="achievements">🏆 Достижения</button><button id="statistics">📊 Статистика</button>
      <button id="settings">⚙️ Настройки</button>
    </div>
  </div>
</div>

<div id="modal" class="modal"><div class="card"><button class="close" id="close">×</button><div id="modalContent"></div></div></div>


<script>
(function(){
  const PASSWORD = "Drakosha48201409";
  const SESSION_KEY = "polylearn_password_ok";
  const gate = document.getElementById("passwordGate");
  const input = document.getElementById("sitePassword");
  const btn = document.getElementById("passwordEnter");
  const error = document.getElementById("passwordError");

  function unlock(){
    if(input.value === PASSWORD){
      sessionStorage.setItem(SESSION_KEY,"1");
      gate.style.display="none";
      error.textContent="";
    }else{
      error.textContent="❌ Неверный пароль";
      input.value="";
      input.focus();
    }
  }
  if(sessionStorage.getItem(SESSION_KEY)==="1") gate.style.display="none";
  else input.focus();
  btn.addEventListener("click",unlock);
  input.addEventListener("keydown",function(e){if(e.key==="Enter") unlock();});
})();
</script>

<script>
const LEVELS=["A1","A2","A3","A4","A5","A6","A7","A8","A9","A10","B1","B2","B3","B4","B5"];
const LANGS=["en","de","es","fr"];
const words={
en:{
A1:[["hello","привет"],["book","книга"],["water","вода"],["house","дом"],["cat","кот"],["dog","собака"],["friend","друг"],["school","школа"]],
A2:[["morning","утро"],["family","семья"],["food","еда"],["city","город"],["work","работа"],["travel","путешествие"],["happy","счастливый"],["learn","учить"]],
A3:[["weather","погода"],["market","рынок"],["question","вопрос"],["answer","ответ"],["important","важный"],["usually","обычно"],["together","вместе"],["different","разный"]]
},
de:{
A1:[["hallo","привет"],["buch","книга"],["wasser","вода"],["haus","дом"],["katze","кот"],["hund","собака"],["freund","друг"],["schule","школа"]],
A2:[["morgen","утро"],["familie","семья"],["essen","еда"],["stadt","город"],["arbeit","работа"],["reise","путешествие"],["glücklich","счастливый"],["lernen","учить"]],
A3:[["wetter","погода"],["markt","рынок"],["frage","вопрос"],["antwort","ответ"],["wichtig","важный"],["normalerweise","обычно"],["zusammen","вместе"],["anders","разный"]]
},
es:{
A1:[["hola","привет"],["libro","книга"],["agua","вода"],["casa","дом"],["gato","кот"],["perro","собака"],["amigo","друг"],["escuela","школа"]],
A2:[["mañana","утро"],["familia","семья"],["comida","еда"],["ciudad","город"],["trabajo","работа"],["viaje","путешествие"],["feliz","счастливый"],["aprender","учить"]],
A3:[["tiempo","погода"],["mercado","рынок"],["pregunta","вопрос"],["respuesta","ответ"],["importante","важный"],["normalmente","обычно"],["juntos","вместе"],["diferente","разный"]]
},
fr:{
A1:[["bonjour","привет"],["livre","книга"],["eau","вода"],["maison","дом"],["chat","кот"],["chien","собака"],["ami","друг"],["école","школа"]],
A2:[["matin","утро"],["famille","семья"],["nourriture","еда"],["ville","город"],["travail","работа"],["voyage","путешествие"],["heureux","счастливый"],["apprendre","учить"]],
A3:[["météo","погода"],["marché","рынок"],["question","вопрос"],["réponse","ответ"],["important","важный"],["d'habitude","обычно"],["ensemble","вместе"],["différent","разный"]]
}};
for(const l of LANGS) for(let i=3;i<LEVELS.length;i++) words[l][LEVELS[i]]=[
["new","новый"],["world","мир"],["people","люди"],["language","язык"],["time","время"],["life","жизнь"],["place","место"],["future","будущее"]
];

let lang=localStorage.getItem("poly_lang")||"en";
let level=localStorage.getItem("poly_level_"+lang)||"A1";
let lessonIndex=0,testIndex=0,score=0;

const $=id=>document.getElementById(id);
function key(lvl){return "poly_pass_"+lang+"_"+lvl}
function passed(lvl){return localStorage.getItem(key(lvl))==="1"}
function currentIndex(){
  let i=0;
  while(i<LEVELS.length-1 && passed(LEVELS[i])) i++;
  return i;
}
function currentLevel(){
  return LEVELS[currentIndex()];
}
function unlocked(i){return i===0 || passed(LEVELS[i-1])}
function saveLevel(){localStorage.setItem("poly_level_"+lang,level)}
function totalXP(){
  let n=0;
  for(const l of LANGS) for(const v of LEVELS) if(localStorage.getItem("poly_pass_"+l+"_"+v)==="1") n++;
  return n*100;
}
function update(){
  $("xp").textContent=totalXP();
  $("coins").textContent=Math.floor(totalXP()/10);
  $("language").value=lang;
  const idx=LEVELS.indexOf(level);
  $("level").innerHTML="";
  LEVELS.forEach((v,i)=>{
    const o=document.createElement("option");o.value=v;o.textContent=v;
    o.disabled=!unlocked(i);$("level").appendChild(o);
  });
  if(!unlocked(idx)){level=currentLevel();saveLevel()}
  $("level").value=level;
  $("levels").innerHTML="";
  LEVELS.forEach((v,i)=>{
    const b=document.createElement("button");b.className="level "+(passed(v)?"done ":"")+(v===level?"active ":"")+(unlocked(i)?"":"locked");
    b.textContent=(passed(v)?"✓ ":"")+v;b.disabled=!unlocked(i);
    b.onclick=()=>{level=v;saveLevel();update()};$("levels").appendChild(b);
  });
}
function speak(text){
  if(localStorage.getItem("poly_sound")!=="0" && "speechSynthesis" in window){
    speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);
    u.lang={en:"en-US",de:"de-DE",es:"es-ES",fr:"fr-FR"}[lang]||"en-US";speechSynthesis.speak(u);
  }
}
function open(content){$("modalContent").innerHTML=content;$("modal").style.display="flex"}
function close(){ $("modal").style.display="none"; if("speechSynthesis"in window)speechSynthesis.cancel() }

function startLesson(){
  lessonIndex=0;
  const arr=words[lang][level];
  open(`<h2>📖 Урок ${level}</h2><div class="progress"><div id="bar" class="bar"></div></div><div id="lesson"></div>`);
  renderLesson();
}
function renderLesson(){
  const arr=words[lang][level],w=arr[lessonIndex];
  $("lesson").innerHTML=`<div class="sub">Слово ${lessonIndex+1} из ${arr.length}</div><div class="word">${w[0]}</div><div class="translation">${w[1]}</div><br><button id="voice">🔊 Произнести</button> <button id="next">${lessonIndex===arr.length-1?"🧠 Начать тест":"Дальше →"}</button>`;
  $("bar").style.width=((lessonIndex+1)/arr.length*100)+"%";
  $("voice").onclick=()=>speak(w[0]);
  if(localStorage.getItem("poly_auto")=="1") setTimeout(()=>speak(w[0]),150);
  $("next").onclick=()=>{if(lessonIndex<arr.length-1){lessonIndex++;renderLesson()}else startTest()};
}
function startTest(){
  testIndex=0;score=0;renderTest();
}
function renderTest(){
  const arr=words[lang][level],correct=arr[testIndex];
  let choices=[correct[1]];
  while(choices.length<4){let x=arr[Math.floor(Math.random()*arr.length)][1];if(!choices.includes(x))choices.push(x)}
  choices.sort(()=>Math.random()-.5);
  open(`<h2>🧠 Тест ${level}</h2><div class="sub">Вопрос ${testIndex+1} из ${arr.length}</div><div class="question">Что означает: <b>${correct[0]}</b>?</div><div class="answers">${choices.map((x,i)=>`<button class="answer" data-i="${i}">${x}</button>`).join("")}</div>`);
  document.querySelectorAll(".answer").forEach(b=>b.onclick=()=>{
    document.querySelectorAll(".answer").forEach(x=>x.disabled=true);
    if(b.textContent===correct[1]){score++;b.classList.add("correct")}else b.classList.add("wrong");
    setTimeout(()=>{testIndex++;if(testIndex<arr.length)renderTest();else finishTest()},500);
  });
}
function finishTest(){
  const total=words[lang][level].length;
  const ok=score/total>=.95;
  if(ok){localStorage.setItem(key(level),"1");level=currentIndex()<LEVELS.length-1?LEVELS[currentIndex()+1]:LEVELS[LEVELS.length-1];saveLevel();update()}
  open(`<h2>${ok?"🎉 Уровень пройден!":"❌ Уровень не пройден"}</h2><p>Результат: <b>${score}/${total}</b> (${Math.round(score/total*100)}%)</p><p>${ok?"Следующий уровень открыт.":"Нужно набрать минимум 95%."}</p><button id="again">${ok?"Продолжить":"Повторить тест"}</button>`);
  $("again").onclick=()=>ok?startLesson():startTest();
}
function showWords(){
  const arr=words[lang][level];
  open(`<h2>📖 Мои слова — ${lang.toUpperCase()}</h2>${arr.map((w,i)=>`<div class="setting"><span><b>${i+1}. ${w[0]}</b></span><span>${w[1]}</span></div>`).join("")}`);
}
function showStats(){open(`<h2>📊 Статистика</h2><p>Язык: <b>${lang.toUpperCase()}</b></p><p>Пройдено на этом языке: <b>${LEVELS.filter(passed).length}</b> / ${LEVELS.length}</p><p>Общий XP: <b>${totalXP()}</b></p><p>Текущий уровень: <b>${currentLevel()}</b></p>`)}
function showProfile(){open(`<h2>👤 Профиль</h2><p>Добро пожаловать в PolyLearn!</p><p>⭐ XP: <b>${totalXP()}</b></p><p>🌍 Язык: <b>${lang.toUpperCase()}</b></p>`)}
function showAchievements(){let n=LEVELS.filter(passed).length;open(`<h2>🏆 Достижения</h2><p>${n>=1?"🏅 Первый уровень — получено":"🔒 Первый уровень — пройди A1"}</p><p>${n>=5?"🏆 5 уровней — получено":"🔒 5 уровней — пройди 5 уровней"}</p><p>${n>=10?"🥇 10 уровней — получено":"🔒 10 уровней — пройди 10 уровней"}</p>`)}
function settings(){
  open(`<h2>⚙️ Настройки</h2>
  <div class="setting"><span>🌍 Язык</span><select id="setLang"><option value="en">🇬🇧 English</option><option value="de">🇩🇪 Deutsch</option><option value="es">🇪🇸 Español</option><option value="fr">🇫🇷 Français</option></select></div>
  <div class="setting"><span>🎨 Тема</span><button id="theme">Переключить тему</button></div>
  <div class="setting"><span>🔊 Озвучка</span><button id="sound">${localStorage.getItem("poly_sound")!=="0"?"ВКЛ":"ВЫКЛ"}</button></div>
  <div class="setting"><span>🗣️ Автоозвучка</span><button id="auto">${localStorage.getItem("poly_auto")==="1"?"ВКЛ":"ВЫКЛ"}</button></div>
  <div class="setting"><span>🗑️ Сбросить весь прогресс</span><button class="danger" id="reset">Сбросить</button></div>`);
  $("setLang").value=lang;
  $("setLang").onchange=()=>{lang=$("setLang").value;localStorage.setItem("poly_lang",lang);level=localStorage.getItem("poly_level_"+lang)||currentLevel();saveLevel();update();close()};
  $("theme").onclick=()=>{document.body.classList.toggle("light");localStorage.setItem("poly_theme",document.body.classList.contains("light")?"light":"dark")};
  $("sound").onclick=()=>{let on=localStorage.getItem("poly_sound")!=="0";localStorage.setItem("poly_sound",on?"0":"1");$("sound").textContent=on?"ВЫКЛ":"ВКЛ"};
  $("auto").onclick=()=>{let on=localStorage.getItem("poly_auto")==="1";localStorage.setItem("poly_auto",on?"0":"1");$("auto").textContent=on?"ВЫКЛ":"ВКЛ"};
  $("reset").onclick=()=>{if(confirm("Сбросить прогресс всех языков?")){Object.keys(localStorage).filter(k=>k.startsWith("poly_pass_")||k.startsWith("poly_level_")).forEach(k=>localStorage.removeItem(k));level="A1";saveLevel();update();close()}};
}
$("close").onclick=close;$("modal").onclick=e=>{if(e.target===$("modal"))close()};
$("language").onchange=()=>{lang=$("language").value;localStorage.setItem("poly_lang",lang);level=localStorage.getItem("poly_level_"+lang)||currentLevel();saveLevel();update()};
$("level").onchange=()=>{level=$("level").value;saveLevel();update()};
$("start").onclick=startLesson;$("study").onclick=startLesson;$("test").onclick=startTest;$("words").onclick=showWords;$("statistics").onclick=showStats;$("profile").onclick=showProfile;$("achievements").onclick=showAchievements;$("settings").onclick=settings;
if(localStorage.getItem("poly_theme")==="light")document.body.classList.add("light");
$("language").value=lang;update();
</script>
</body>
</html>
